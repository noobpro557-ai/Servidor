services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:20128:20128" # troque por "20128:20128" para expor na rede
    volumes:
      - omniroute-data:/app/data
volumes:
  omniroute-data:
